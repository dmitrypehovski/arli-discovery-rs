[package]
name = "arli-discovery-rs"
version = "0.1.0"
edition = "2021"
description = "Second implementation of the ARLI Discovery Extension. Its purpose is to prove the normative text is implementable and to answer the performance question the Python reference cannot."
license = "Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
sha2 = "0.10"
hmac = "0.12"
rand = "0.8"
base64 = "0.22"
hex = "0.4"
num-bigint = { version = "0.4", features = ["rand"] }
num-traits = "0.2"
p256 = { version = "0.13", features = ["ecdsa", "jwk"] }

[profile.release]
opt-level = 3
lto = true
